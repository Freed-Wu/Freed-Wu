---
exclude: |-
  (?x:^\.config/nvim/templates/
    | ^\.config/gh/config\.yml$
    | ^AppData/Local/Packages/Microsoft\.WindowsTerminal_
    | ^\.docker/config\.json$
    | ^\.config/pudb/pudb\.cfg$
    | ^\.config/fcitx
    | ^\.config/hyfetch\.json$
    | /cache/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-symlinks
        exclude: ^AppData/Local/nvim-data$
      - id: check-ast
      - id: debug-statements
      - id: requirements-txt-fixer
      - id: check-xml
      - id: check-yaml
      - id: check-toml
      - id: check-json
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        args:
          - --msg-filename
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        # https://github.com/editorconfig-checker/editorconfig-checker/issues/505
        args:
          - -disable-charset
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: check-mailmap
      # https://github.com/koalaman/shellcheck/issues/2909
      - id: shellcheck
        exclude: /PKGBUILD\.vim$
        exclude_types:
          - zsh
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-pyproject
          - mdformat-gfm
          - mdformat-myst
          - mdformat-toc
          - mdformat-deflist
          - mdformat-beautysh
          - mdformat-ruff
          - mdformat-config
          - mdformat-web
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdown-it-texmath
  - repo: https://github.com/perltidy/perltidy
    rev: "20260705.01"
    hooks:
      - id: perltidy
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude: /PKGBUILD\.vim$
        exclude_types:
          - zsh
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
      - id: ruff-format
  # - repo: https://github.com/astral-sh/ty-pre-commit
  #   rev: v0.0.56
  #   hooks:
  #     - id: ty
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        exclude_types:
          - json
          - javascript
  - repo: https://github.com/vimjas/vint
    rev: v0.4a3
    hooks:
      - id: vint
  - repo: https://github.com/google/vimdoc
    rev: v0.7.1
    hooks:
      - id: vimdoc
        args:
          - .config/nvim
  - repo: https://github.com/lunarmodules/luacheck
    rev: v1.2.0
    hooks:
      - id: luacheck
  - repo: https://github.com/rubocop/rubocop
    rev: v1.88.2
    hooks:
      - id: rubocop
  - repo: https://github.com/NixOS/nixfmt
    rev: v1.4.0
    hooks:
      - id: nixfmt

ci:
  skip:
    - nixfmt
    # - ty
    - shellcheck
  autoupdate_branch: dev
